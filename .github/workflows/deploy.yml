name: Build & Deploy Docs

on:
  push:
    branches: [production]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target matching a GitHub Environment
        required: true
        default: docs

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.event.inputs.target || 'docs' }}
  cancel-in-progress: true

env:
  APP_DIR: /opt/sportgearhub-docs-site
  RELEASE_ARCHIVE: sportgearhub-docs-site.tar.gz

jobs:
  build-and-deploy:
    name: Deploy to ${{ github.event.inputs.target || 'docs' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'docs' }}

    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v5

      - name: Validate deployment config
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ]; then
            echo "GitHub Environment variable SERVER_HOST is empty or missing." >&2
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "GitHub Environment variable SERVER_USER is empty or missing." >&2
            exit 1
          fi
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "GitHub Environment secret SERVER_SSH_KEY is empty or missing." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Clone docs repo
        run: |
          if [ -n "${{ secrets.DOCS_REPO_TOKEN }}" ]; then
            git clone --depth 1 --branch production https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/sportgearhub/sportgearhub-docs.git external-docs
          else
            git clone --depth 1 --branch production https://github.com/sportgearhub/sportgearhub-docs.git external-docs
          fi

      - name: Replace docs and i18n folders
        run: |
          rm -rf docs
          if [ ! -d external-docs/docs ]; then
            echo "external-docs/docs not found"
            exit 1
          fi
          mv external-docs/docs ./docs
          rm -rf i18n
          if [ -d external-docs/i18n ]; then
            mv external-docs/i18n ./i18n
          fi

      - name: Copy registry links
        run: |
          mkdir -p static
          if [ -f external-docs/registry/links.json ]; then
            cp external-docs/registry/links.json static/links.json
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          DOCSEARCH_APP_ID: ${{ secrets.DOCSEARCH_APP_ID }}
          DOCSEARCH_API_KEY: ${{ secrets.DOCSEARCH_API_KEY }}
          DOCSEARCH_INDEX_NAME: ${{ secrets.DOCSEARCH_INDEX_NAME }}

      - name: Pack release
        run: tar -czf "$RELEASE_ARCHIVE" Dockerfile docker-compose.yml .dockerignore build

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" "$RELEASE_ARCHIVE" "$SERVER_USER@$SERVER_HOST:/tmp/$RELEASE_ARCHIVE"

      - name: Deploy on target host
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
          SERVER_USER: ${{ vars.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "APP_DIR='$APP_DIR' RELEASE_ARCHIVE='$RELEASE_ARCHIVE' bash -s" <<'EOF'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          rm -rf "$APP_DIR/build"
          tar -xzf "/tmp/$RELEASE_ARCHIVE" -C "$APP_DIR"
          rm -f "/tmp/$RELEASE_ARCHIVE"

          cd "$APP_DIR"
          docker network inspect apps-proxy >/dev/null 2>&1 || docker network create apps-proxy
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
          else
            docker-compose up -d --build
          fi
          EOF
